name: iOS Build & Test (Develop)

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

jobs:
    build-and-test:
        runs-on: macos-latest

        steps:
            - name: 📦 Checkout code
              uses: actions/checkout@v4

            - name: 🍎 Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: 3.1

            - name: 🔧 Install dependencies
              run: |
                  gem install bundler
                  bundle install || bundle update
                  bundle exec fastlane --version

            - name: 🔐 Setup SSH for match repo
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.MATCH_GIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts

            - name: 🧪 Run Tests
              run: bundle exec fastlane run_tests
              env:
                  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
                  FASTLANE_USER: ${{ secrets.APP_STORE_CONNECT_EMAIL }}
                  APP_STORE_CONNECT_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}

            - name: 📦 Build Development IPA
              run: bundle exec fastlane dev_build
              env:
                  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
                  FASTLANE_USER: ${{ secrets.APP_STORE_CONNECT_EMAIL }}
                  APP_STORE_CONNECT_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
