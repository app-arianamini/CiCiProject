# .github/workflows/ios.yml
name: iOS Build & Test (Develop)

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

jobs:
    build-and-test:
        runs-on: macos-15

        steps:
            - name: 📦 Checkout code
              uses: actions/checkout@v4

            - name: 🔧 Setup Xcode 16.2
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: "16.2"

            - name: ✅ Enable support for synchronized file groups
              run: echo 'IDEFileSystemSynchronizedGroupsAreEnabled=YES' >> $GITHUB_ENV

            - name: 📂 Cache Swift Packages
              uses: actions/cache@v3
              with:
                  path: |
                      ~/Library/Developer/Xcode/DerivedData
                      ~/Library/Caches/org.swift.swiftpm
                  key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-spm-

            - name: 🍎 Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: 3.1

            - name: 🔧 Install dependencies
              run: |
                  gem update --system
                  gem install bundler
                  bundle install || bundle update
                  bundle exec fastlane --version

            - name: 🔐 Setup SSH for match repo
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.MATCH_GIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts

            - name: 🔑 Setup certificates and provisioning profiles
              run: bundle exec fastlane ci_setup
              env:
                  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
                  FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
                  FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
                  APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}

            - name: 🧪 Run Tests
              run: bundle exec fastlane ci_tests
              env:
                  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
                  FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
                  FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
                  APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}

            - name: 🏗️ Build app
              run: bundle exec fastlane dev_build
              env:
                  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
                  FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
                  FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
                  APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
